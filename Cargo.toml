[package]
name = "rign"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rign"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.46.1", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12.22", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
anyhow = "1.0.98"
zip = "4.2.0"
console = "0.16.0"
indicatif = "0.18.0"
dialoguer = "0.11.0"
junction = "1.2.0"
windows-env = "0.2.0"
regex = "1.11.1"
